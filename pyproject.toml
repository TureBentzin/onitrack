[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "onitrack"
version = "0.1.0"
description = ""
requires-python = ">=3.11"

[project.scripts]
onitrack = "onitrack.main:main"

[tool.setuptools.packages.find]
include = ["onitrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
